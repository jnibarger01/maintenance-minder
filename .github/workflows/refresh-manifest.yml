name: Refresh photo manifest

# The photo manifest is a build artefact committed to the repo. Honda rotates
# and adds Info Center assets, so refresh it on a schedule and let the normal
# Pages deploy workflow publish whatever changed.

on:
  schedule:
    # Sundays at 06:17 UTC
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild manifest
        run: python3 scripts/build_manifest.py

      - name: Verify no wrong-year or wrong-trim photos leaked
        run: python3 scripts/verify_manifest.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- images.json; then
            echo "manifest unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.json
          git commit -m "chore: refresh vehicle photo manifest"
          git push